services:
  - type: web
    name: flowmind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL        # paste your Neon/Postgres connection string in the Render dashboard
        sync: false
      - key: AI_API_KEY          # paste your Gemini key in the Render dashboard
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: AI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SEED_ON_START
        value: "true"
